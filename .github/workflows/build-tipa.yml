name: Build tipa

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Make devkit executable
        run: chmod +x devkit/*.sh

      # 脚本加载器 payload：工程里没有就去 PandoraLoader 的 Release 拉。
      # 拉不到不影响构建（只是打出一个不含加载器的包），所以 continue-on-error。
      # 私有仓库需要在仓库设置里加 PANDORA_TOKEN（有 repo 权限的 PAT）。
      - name: Fetch PandoraLoader.dylib (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PANDORA_TOKEN || github.token }}
        run: |
          if [ -f TrollFools/PandoraLoader.dylib ]; then
            echo "工程里已有 TrollFools/PandoraLoader.dylib，跳过拉取"
            ls -l TrollFools/PandoraLoader.dylib
            exit 0
          fi
          gh release download --repo xiaoshiliu0918/PandoraLoader \
            --pattern 'PandoraLoader.dylib' --dir TrollFools --clobber \
            && ls -l TrollFools/PandoraLoader.dylib \
            || echo "没拉到加载器（仓库不存在 / 没发 release / 缺 PANDORA_TOKEN），本次包不含脚本加载器"

      - name: Build tipa
        run: |
          set -o pipefail
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Collect tipa
        if: success()
        run: |
          VERSION=$(awk -F "=" '/^VERSION/ {print $2}' TrollFools/Version.xcconfig | tr -d '[:space:]')
          BUILD=$(awk -F "=" '/^BUILD_NUMBER/ {print $2}' TrollFools/Version.xcconfig | tr -d '[:space:]')
          echo "NAME=SLTrollFools-${VERSION}-${BUILD}" >> $GITHUB_ENV
          echo "TAG=v${VERSION}-b${BUILD}" >> $GITHUB_ENV
          mkdir -p out
          ls -la packages
          TIPA=$(find packages -maxdepth 1 -name '*.tipa' | head -1)
          test -n "$TIPA" || { echo "no tipa produced"; exit 1; }
          cp "$TIPA" "out/SLTrollFools-${VERSION}-${BUILD}.tipa"
          unzip -l "out/SLTrollFools-${VERSION}-${BUILD}.tipa" | head -30

      - name: Upload tipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*.tipa
          if-no-files-found: error

      - name: Publish release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NAME }}
          body: |
            SLTrollFools 自动构建产物。

            - 画面：液态磨砂玻璃（柔光壁纸底 + 独立磨砂卡），深色 / 浅色双主题
            - 动效：HGhubX 弹性曲线
            - 支持 iOS 14.0+（iOS 15+ 叠加真模糊 Material）
          files: out/*.tipa
          fail_on_unmatched_files: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
